[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-mcp-python"
version = "1.0.0"
description = "基于 MCP 的远程日志查询服务（Python 版）：可插拔执行通道（SSH 私钥 / pyinfra / 本地）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
]

[project.optional-dependencies]
pyinfra = ["pyinfra>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
log-mcp = "log_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["log_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
